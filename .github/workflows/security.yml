name: Security & Quality CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript Typecheck
        run: npx tsc --noEmit

      - name: Static Security Contracts
        run: npm run test:security:static

      - name: Design System Contract
        run: npm run test:design

      - name: Studio Contract Tests
        run: npm run test:studio

      - name: Linter Check
        run: npm run lint

      - name: Production Build Verification
        env:
          NEXT_PUBLIC_SUPABASE_URL: "https://placeholder-project.supabase.co"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.e30.placeholder"
        # next/font/google mengunduh font saat build; gangguan jaringan sesaat ke Google Fonts pernah menggagalkan
        # build tanpa kesalahan kode. Coba ulang hingga 3 kali; kegagalan sungguhan tetap gagal di percobaan terakhir.
        run: |
          for attempt in 1 2 3; do
            if npm run build; then exit 0; fi
            echo "Build gagal (percobaan $attempt dari 3)"
            sleep 15
          done
          exit 1
