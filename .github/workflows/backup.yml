name: Weekly Database Backup

on:
  schedule:
    # Berjalan otomatis setiap hari Minggu jam 00:00 UTC (07:00 WIB)
    - cron: '0 0 * * 0'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Install PostgreSQL 17 Client
        run: |
          set -euo pipefail
          # apt-key sudah dihapus dari runner Ubuntu 24.04; pakai keyring terpisah (signed-by).
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17

      - name: Ekspor Database (pg_dump) & Hitung Checksum
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          /usr/lib/postgresql/17/bin/pg_dump "$SUPABASE_DB_URL" -F c -f database-backup.dump
          sha256sum database-backup.dump > database-backup.dump.sha256

      - name: Verifikasi Isi Backup
        run: |
          set -euo pipefail
          # Backup yang tidak bisa dibaca sama buruknya dengan tidak ada backup.
          size=$(stat -c%s database-backup.dump)
          echo "Ukuran backup: ${size} byte"
          test "$size" -gt 10000
          /usr/lib/postgresql/17/bin/pg_restore --list database-backup.dump | grep -q 'TABLE DATA public articles'
          echo "Backup terbaca dan memuat tabel articles."

      - name: Simpan File ke GitHub Artifacts
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: saintifiks-db-backup-${{ github.run_id }}
          path: |
            database-backup.dump
            database-backup.dump.sha256
          retention-days: 30